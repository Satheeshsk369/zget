name: Test Install Script

on:
  workflow_dispatch:

jobs:
  test-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS aarch64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install zget
        run: |
          curl -sSfL https://raw.githubusercontent.com/Satheeshsk369/zget/${{ github.ref_name }}/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Zig
        run: |
          zget install 0.17.0
          zget set 0.17.0
      - name: Verify
        run: |
          zget list
          zig version

  test-windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Install zget
        shell: pwsh
        run: |
          $script = (Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/Satheeshsk369/zget/${{ github.ref_name }}/install.ps1).Content
          Invoke-Expression $script
          "$env:LOCALAPPDATA\zget\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Disable Defender for Zig data directory
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\zget"

      - name: Install Zig
        shell: pwsh
        run: |
          zget install 0.17.0
          zget set 0.17.0
      - name: Verify
        shell: pwsh
        run: |
          zget list
          zig version
