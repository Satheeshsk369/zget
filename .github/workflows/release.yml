name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Zig & zget downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/zig
            ~/.cache/zget
            ~/.local/bin
          key: ${{ runner.os }}-zig-0.17.0-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.17.0-

      - name: Install zget & Zig
        run: |
          mkdir -p $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          if ! command -v zget >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/Satheeshsk369/zget/v0.4.0/install.sh | sh
          fi
          $HOME/.local/bin/zget install 0.17.0
          $HOME/.local/bin/zget set 0.17.0
          zig version
        shell: bash

      - name: Cross-Compile Binaries
        run: |
          mkdir -p dist

          for arch in x86 x86_64 aarch64; do
            echo "Building Linux $arch"
            zig build -Doptimize=ReleaseFast -Dtarget=$arch-linux
            cp zig-out/bin/zget dist/zget-$arch-linux
          done

          for arch in x86_64 aarch64; do
            echo "Building macOS $arch"
            zig build -Doptimize=ReleaseFast -Dtarget=$arch-macos
            cp zig-out/bin/zget dist/zget-$arch-macos
          done

          for arch in x86 x86_64 aarch64; do
            echo "Building Windows $arch"
            zig build -Doptimize=ReleaseFast -Dtarget=$arch-windows
            cp zig-out/bin/zget.exe dist/zget-$arch-windows.exe
          done
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
